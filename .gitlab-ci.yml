# Claude Code in GitLab CI (beta): https://code.claude.com/docs/en/gitlab-ci-cd
#
# claude-review, once turned on (see below), runs on every MR and posts one
# review note. Claude only gets
# read-only tools and runs without GITLAB_ACCESS_TOKEN in its environment;
# this script, not Claude, posts the note, and CI never pushes code.
#
# Manual "@claude" run: CI/CD > Pipelines > Run pipeline, with the variable
# AI_FLOW_INPUT set to the request. The answer is printed in the job log.
#
# The job is off until a runner exists: with no runner it would leave every
# MR with a pipeline stuck on "pending". Turn it on with the CI/CD variable
# CLAUDE_REVIEW_ENABLED = true.
#
# Masked CI/CD variables (Settings > CI/CD > Variables), never in this file.
# Don't mark them Protected: MR pipelines run on unprotected issue branches.
#   ANTHROPIC_API_KEY    Claude API key
#   GITLAB_ACCESS_TOKEN  project access token, api scope, Reporter role

stages:
  - ai

claude-review:
  stage: ai
  image: node:24-alpine3.21
  rules:
    - if: '$CLAUDE_REVIEW_ENABLED != "true"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "web" && $AI_FLOW_INPUT'
  # Review feedback must never block a merge, e.g. during an API outage.
  allow_failure: true
  timeout: 15m
  variables:
    GIT_STRATEGY: fetch
    # Full history, so the MR's diff base commit exists.
    GIT_DEPTH: "0"
    # On Alpine (musl), Claude Code's Grep and Glob need the system ripgrep.
    USE_BUILTIN_RIPGREP: "0"
  before_script:
    - apk add --no-cache git curl bash jq libgcc libstdc++ ripgrep
    - curl -fsSL https://claude.ai/install.sh | bash
    # The installer puts claude in ~/.local/bin, which isn't on PATH here.
    - export PATH="$HOME/.local/bin:$PATH"
  script:
    - |
      if [ -n "$CI_MERGE_REQUEST_IID" ]; then
        PROMPT="Review merge request !$CI_MERGE_REQUEST_IID: $CI_MERGE_REQUEST_TITLE.
      See the change with: git diff $CI_MERGE_REQUEST_DIFF_BASE_SHA...HEAD
      Check it for correctness bugs and for the rules in CLAUDE.md and AGENTS.md.
      If it touches docs/issues/<NN>-*.md, check the work against that issue's tasks.
      Reply in Markdown: a one-line verdict, then numbered findings with file:line,
      most severe first. Say so plainly if you find nothing. Don't praise the code."
      else
        PROMPT="$AI_FLOW_INPUT"
      fi
    - >
      env -u GITLAB_ACCESS_TOKEN
      claude -p "$PROMPT"
      --max-turns 25
      --allowedTools "Read Grep Glob Bash(git diff:*) Bash(git log:*) Bash(git show:*)"
      > review.md
    - cat review.md
    - |
      # Claude can still read ANTHROPIC_API_KEY, so an injected instruction in
      # the diff could put it in the review. Never post a review holding a secret.
      for secret in "$ANTHROPIC_API_KEY" "$GITLAB_ACCESS_TOKEN"; do
        if [ -n "$secret" ] && grep -qF "$secret" review.md; then
          echo "review.md contains a secret; not posting it." >&2
          exit 1
        fi
      done
    - |
      if [ -n "$CI_MERGE_REQUEST_IID" ] && [ -s review.md ]; then
        jq -Rs '{body: ("**@claude review**\n\n" + .)}' review.md |
          curl -fsS -X POST \
            -H "PRIVATE-TOKEN: $GITLAB_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data @- \
            "$CI_API_V4_URL/projects/$CI_PROJECT_ID/merge_requests/$CI_MERGE_REQUEST_IID/notes" > /dev/null
      fi
