# The same five checks as CLAUDE.md > Checks, on every PR and on the
# integration branch.

name: CI

on:
  pull_request:
    branches: [feat/ai-tools, main]
  push:
    branches: [feat/ai-tools]

permissions:
  contents: read

# A new push to a PR replaces its running check. Each push to feat/ai-tools
# gets its own group, so every merge commit gets a result.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # Reads the pnpm version from package.json's packageManager field.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm build
      - run: pnpm test
